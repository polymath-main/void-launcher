name: Build VoidLauncher v3 APK

on:
  push:
    branches: [ main, feature/v3-ui ]
  pull_request:
    branches: [ main, feature/v3-ui ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble v3 Release & Debug APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Upload v3 Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-launcher-v3.0.0-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload v3 Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: void-launcher-v3.0.0-debug
          path: app/build/outputs/apk/debug/*.apk
